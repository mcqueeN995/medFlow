# ==================== COMPONENTS ====================
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT access-токен

  responses:
    BadRequest:
      description: Ошибка валидации
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Не авторизован
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Недостаточно прав
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Ресурс не найден
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Конфликт (дублирование)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    RateLimited:
      description: Превышен лимит запросов
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    # ---------- Enums ----------
    UserRole:
      type: string
      enum: [guest, user, moderator, admin]
    University:
      type: string
      enum: [sechenov, pirogov, evdokimov, other]
    TextbookStorageType:
      type: string
      enum: [A, B]
    TextbookLicenseType:
      type: string
      enum: [cc_by, cc_by_nc, cc_by_sa, cc0, public_domain, all_rights_reserved, custom]
    CardTaskStatus:
      type: string
      enum: [pending, processing, done, failed]
    CardTaskSourceType:
      type: string
      enum: [catalog_textbook, user_upload]
    CardDifficulty:
      type: string
      enum: [easy, medium, hard]
    PoiType:
      type: string
      enum: [coworking, cafe, library, canteen, park, other]
    ThreadTag:
      type: string
      enum: [study, department, humor, marketplace, clinical_base, news, help, other]
    ReportStatus:
      type: string
      enum: [pending, reviewed, dismissed]
    SubscriptionTargetType:
      type: string
      enum: [thread, user, tag]
    ReactionTargetType:
      type: string
      enum: [thread, comment]
    AuditAction:
      type: string
      enum:
        - user_ban
        - user_unban
        - user_role_change
        - thread_hide
        - thread_unhide
        - thread_delete
        - comment_hide
        - comment_unhide
        - comment_delete
        - poi_create
        - poi_update
        - poi_delete
        - textbook_create
        - textbook_update
        - textbook_delete
    NotificationType:
      type: string
      enum:
        - thread_reply
        - comment_reply
        - reaction
        - card_task_done
        - card_task_failed
        - moderation_action
        - system

    # ---------- Common ----------
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
            details:
              type: array
              items:
                type: object
                properties:
                  field: { type: string }
                  reason: { type: string }

    PaginationWrapper:
      type: object
      properties:
        pagination:
          type: object
          properties:
            page: { type: integer }
            limit: { type: integer }
            total: { type: integer }
            has_next: { type: boolean }

    # ---------- Auth ----------
    RegisterRequest:
      type: object
      required: [email, password, nickname, agree_to_terms]
      properties:
        email: { type: string, format: email }
        password: { type: string, minLength: 8 }
        nickname: { type: string, minLength: 3, maxLength: 50 }
        university: { $ref: '#/components/schemas/University' }
        course: { type: integer, minimum: 1, maximum: 7 }
        faculty: { type: string, maxLength: 100 }
        agree_to_terms: { type: boolean, enum: [true] }

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }

    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token: { type: string }

    LogoutRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token: { type: string }

    AuthResponse:
      type: object
      properties:
        user: { $ref: '#/components/schemas/UserProfile' }
        access_token: { type: string }
        refresh_token: { type: string }
        expires_in: { type: integer, description: Секунды до истечения access-токена }

    TokenPair:
      type: object
      properties:
        access_token: { type: string }
        refresh_token: { type: string }
        expires_in: { type: integer }

    BanInfo:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string, enum: [BANNED] }
            message: { type: string }
            ban_reason: { type: string }
            banned_at: { type: string, format: date-time }

    # ---------- Users ----------
    UserProfile:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        nickname: { type: string }
        role: { $ref: '#/components/schemas/UserRole' }
        university: { $ref: '#/components/schemas/University' }
        course: { type: integer }
        faculty: { type: string }
        email_verified_at: { type: string, format: date-time, nullable: true }
        banned_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }

    PublicUser:
      type: object
      properties:
        id: { type: string, format: uuid }
        nickname: { type: string }
        university: { $ref: '#/components/schemas/University' }
        course: { type: integer }
        faculty: { type: string }
        created_at: { type: string, format: date-time }
        threads_count: { type: integer }
        is_banned: { type: boolean }

    UpdateProfileRequest:
      type: object
      properties:
        nickname: { type: string, minLength: 3, maxLength: 50 }
        university: { $ref: '#/components/schemas/University' }
        course: { type: integer, minimum: 1, maximum: 7 }
        faculty: { type: string, maxLength: 100 }

    AdminUser:
      allOf:
        - $ref: '#/components/schemas/UserProfile'
        - type: object
          properties:
            ban_reason: { type: string }
            banned_by: { type: string, format: uuid }

    # ---------- Upload ----------
    UploadResponse:
      type: object
      properties:
        file_id: { type: string, format: uuid }
        url: { type: string, format: uri }
        size_bytes: { type: integer }
        mime_type: { type: string }
        expires_at: { type: string, format: date-time, nullable: true }

    # ---------- Library ----------
    Textbook:
      type: object
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        authors: { type: string }
        isbn: { type: string }
        year: { type: integer }
        pages: { type: integer }
        description: { type: string }
        subject: { type: string }
        course: { type: integer }
        department: { type: string }
        storage_type: { $ref: '#/components/schemas/TextbookStorageType' }
        license_type: { $ref: '#/components/schemas/TextbookLicenseType' }
        copyright_holder: { type: string }
        hidden_at: { type: string, format: date-time, nullable: true }
        deleted_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }

    TextbookListItem:
      type: object
      description: Для категории B — только title, storage_type, license_type
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        authors: { type: string, nullable: true }
        isbn: { type: string, nullable: true }
        year: { type: integer, nullable: true }
        subject: { type: string, nullable: true }
        course: { type: integer, nullable: true }
        storage_type: { $ref: '#/components/schemas/TextbookStorageType' }
        license_type: { $ref: '#/components/schemas/TextbookLicenseType' }
        created_at: { type: string, format: date-time }

    CreateTextbookRequest:
      type: object
      required: [title, storage_type]
      properties:
        title: { type: string, maxLength: 500 }
        authors: { type: string }
        isbn: { type: string, maxLength: 20 }
        year: { type: integer }
        pages: { type: integer }
        description: { type: string }
        subject: { type: string, maxLength: 100 }
        course: { type: integer }
        department: { type: string, maxLength: 100 }
        storage_type: { $ref: '#/components/schemas/TextbookStorageType' }
        license_type: { $ref: '#/components/schemas/TextbookLicenseType' }
        copyright_holder: { type: string, maxLength: 255 }
        pdf_file_id: { type: string, format: uuid, description: Только для категории A }
        source_url: { type: string, format: uri, description: Только для категории B }

    UpdateTextbookRequest:
      type: object
      properties:
        title: { type: string, maxLength: 500 }
        authors: { type: string }
        isbn: { type: string }
        year: { type: integer }
        pages: { type: integer }
        description: { type: string }
        subject: { type: string }
        course: { type: integer }
        department: { type: string }
        storage_type: { $ref: '#/components/schemas/TextbookStorageType' }
        license_type: { $ref: '#/components/schemas/TextbookLicenseType' }
        copyright_holder: { type: string }
        pdf_file_id: { type: string, format: uuid }
        source_url: { type: string, format: uri }

    # ---------- Cards ----------
    CreateCardTaskRequest:
      type: object
      required: [file_id, topic]
      properties:
        file_id: { type: string, format: uuid }
        textbook_id: { type: string, format: uuid }
        topic: { type: string, maxLength: 255 }
        difficulty: { $ref: '#/components/schemas/CardDifficulty' }
        cards_count: { type: integer, minimum: 1, maximum: 100 }

    CardTask:
      type: object
      properties:
        id: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/CardTaskStatus' }
        position_in_queue: { type: integer, nullable: true }
        estimated_wait_seconds: { type: integer, nullable: true }
        cards_count: { type: integer }
        error_message: { type: string, nullable: true }
        started_at: { type: string, format: date-time, nullable: true }
        finished_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }

    Card:
      type: object
      properties:
        id: { type: string, format: uuid }
        chapter: { type: string }
        topic: { type: string }
        subtopic: { type: string }
        question: { type: string }
        answer: { type: string }
        page_approx: { type: integer }
        source_reference: { type: string }
        difficulty: { $ref: '#/components/schemas/CardDifficulty' }
        disclaimer: { type: string }
        created_at: { type: string, format: date-time }

    ReviewCard:
      type: object
      properties:
        card_id: { type: string, format: uuid }
        question: { type: string }
        answer: { type: string }
        disclaimer: { type: string }
        progress: { $ref: '#/components/schemas/CardProgressInfo' }

    CardProgressInfo:
      type: object
      properties:
        next_review_at: { type: string, format: date-time }
        interval_days: { type: integer }
        ease_factor: { type: number, format: double }
        repetitions: { type: integer }

    CardsStats:
      type: object
      properties:
        total_cards_learned: { type: integer }
        due_today: { type: integer }
        streak_days: { type: integer }
        avg_ease_factor: { type: number, format: double }
        by_difficulty:
          type: object
          properties:
            easy: { type: integer }
            medium: { type: integer }
            hard: { type: integer }

    # ---------- Map ----------
    POI:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        type: { $ref: '#/components/schemas/PoiType' }
        latitude: { type: number, format: double }
        longitude: { type: number, format: double }
        address: { type: string }
        description: { type: string }
        photo_url: { type: string, format: uri }
        rating: { type: number, format: double }
        tags:
          type: array
          items: { type: string }
        distance_meters: { type: integer, nullable: true }
        walking_time_seconds: { type: integer, nullable: true }
        created_at: { type: string, format: date-time }

    CreatePOIRequest:
      type: object
      required: [name, type, latitude, longitude]
      properties:
        name: { type: string, maxLength: 255 }
        type: { $ref: '#/components/schemas/PoiType' }
        latitude: { type: number, format: double }
        longitude: { type: number, format: double }
        address: { type: string }
        description: { type: string }
        photo_url: { type: string, format: uri }
        tags:
          type: array
          items: { type: string }

    UpdatePOIRequest:
      type: object
      properties:
        name: { type: string, maxLength: 255 }
        type: { $ref: '#/components/schemas/PoiType' }
        latitude: { type: number, format: double }
        longitude: { type: number, format: double }
        address: { type: string }
        description: { type: string }
        photo_url: { type: string, format: uri }
        tags:
          type: array
          items: { type: string }

    # ---------- Threads ----------
    Thread:
      type: object
      properties:
        id: { type: string, format: uuid }
        author: { $ref: '#/components/schemas/PublicUser' }
        title: { type: string }
        content: { type: string }
        tags:
          type: array
          items: { $ref: '#/components/schemas/ThreadTag' }
        files:
          type: array
          items:
            type: object
            properties:
              url: { type: string, format: uri }
              name: { type: string }
              size_bytes: { type: integer }
        views_count: { type: integer }
        likes_count: { type: integer }
        comments_count: { type: integer }
        hidden_at: { type: string, format: date-time, nullable: true }
        deleted_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }

    ThreadListItem:
      allOf:
        - $ref: '#/components/schemas/Thread'
        - type: object
          description: Без поля content

    CreateThreadRequest:
      type: object
      required: [title, content]
      properties:
        title: { type: string, maxLength: 500 }
        content: { type: string, maxLength: 50000 }
        tags:
          type: array
          items: { $ref: '#/components/schemas/ThreadTag' }
          maxItems: 5
        file_ids:
          type: array
          items: { type: string, format: uuid }
          maxItems: 5

    UpdateThreadRequest:
      type: object
      properties:
        title: { type: string, maxLength: 500 }
        content: { type: string, maxLength: 50000 }
        tags:
          type: array
          items: { $ref: '#/components/schemas/ThreadTag' }

    # ---------- Comments ----------
    Comment:
      type: object
      properties:
        id: { type: string, format: uuid }
        author: { $ref: '#/components/schemas/PublicUser' }
        content: { type: string }
        depth: { type: integer }
        likes_count: { type: integer }
        hidden_at: { type: string, format: date-time, nullable: true }
        deleted_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }

    CommentTree:
      allOf:
        - $ref: '#/components/schemas/Comment'
        - type: object
          properties:
            replies:
              type: array
              items: { $ref: '#/components/schemas/Comment' }

    CreateCommentRequest:
      type: object
      required: [content]
      properties:
        content: { type: string, minLength: 1, maxLength: 5000 }
        parent_id: { type: string, format: uuid, nullable: true }

    # ---------- Reactions ----------
    Reaction:
      type: object
      properties:
        id: { type: string, format: uuid }
        emoji: { type: string }
        target_type: { $ref: '#/components/schemas/ReactionTargetType' }
        target_id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }

    # ---------- Reports ----------
    Report:
      type: object
      properties:
        id: { type: string, format: uuid }
        reporter_id: { type: string, format: uuid }
        target_type: { type: string }
        target_id: { type: string, format: uuid }
        reason: { type: string }
        status: { $ref: '#/components/schemas/ReportStatus' }
        reviewed_by: { type: string, format: uuid, nullable: true }
        reviewed_at: { type: string, format: date-time, nullable: true }
        resolution_note: { type: string, nullable: true }
        created_at: { type: string, format: date-time }

    # ---------- Subscriptions ----------
    Subscription:
      type: object
      properties:
        id: { type: string, format: uuid }
        target_type: { $ref: '#/components/schemas/SubscriptionTargetType' }
        target_id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }

    CreateSubscriptionRequest:
      type: object
      required: [target_type, target_id]
      properties:
        target_type: { $ref: '#/components/schemas/SubscriptionTargetType' }
        target_id: { type: string, format: uuid }

    # ---------- Notifications ----------
    Notification:
      type: object
      properties:
        id: { type: string, format: uuid }
        type: { $ref: '#/components/schemas/NotificationType' }
        title: { type: string }
        message: { type: string }
        payload:
          type: object
          additionalProperties: true
        target_type: { type: string, nullable: true }
        target_id: { type: string, format: uuid, nullable: true }
        is_read: { type: boolean }
        read_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }

    # ---------- Push ----------
    PushSubscriptionRequest:
      type: object
      required: [endpoint, p256dh, auth]
      properties:
        endpoint: { type: string, format: uri }
        p256dh: { type: string }
        auth: { type: string }

    PushPreferences:
      type: object
      properties:
        thread_reply: { type: boolean }
        comment_reply: { type: boolean }
        reaction: { type: boolean }
        card_task_done: { type: boolean }
        card_task_failed: { type: boolean }
        moderation_action: { type: boolean }
        system: { type: boolean }

    # ---------- Admin ----------
    AdminStats:
      type: object
      properties:
        users_total: { type: integer }
        users_banned: { type: integer }
        threads_total: { type: integer }
        card_tasks_total: { type: integer }
        card_tasks_pending: { type: integer }
        active_sessions: { type: integer }

    AuditLog:
      type: object
      properties:
        id: { type: string, format: uuid }
        actor_id: { type: string, format: uuid }
        actor_nickname: { type: string }
        action: { $ref: '#/components/schemas/AuditAction' }
        target_type: { type: string, nullable: true }
        target_id: { type: string, format: uuid, nullable: true }
        reason: { type: string, nullable: true }
        metadata:
          type: object
          additionalProperties: true
          nullable: true
        ip_address: { type: string }
        created_at: { type: string, format: date-time }