openapi: 3.0.3
info:
  title: MedFlow API
  description: |
    REST API для PWA-приложения MedFlow — сервиса для студентов-медиков Москвы.
    
    Модули:
    - Auth & Users
    - Library (каталог учебников с лицензионными категориями A/B)
    - Cards (ИИ-генерация карточек + интервальное повторение SM-2)
    - Map (навигатор POI)
    - Threads & Comments (форум)
    - Subscriptions & Notifications
    - Admin (модерация, аудит)
  version: 1.0.0
  contact:
    name: MedFlow Team

servers:
  - url: http://localhost:8080/api/v1
    description: Локальная разработка
  - url: https://api.medflow.ru/api/v1
    description: Production

tags:
  - name: Auth
    description: Регистрация, вход, токены
  - name: Users
    description: Профили пользователей
  - name: Upload
    description: Загрузка файлов (PDF, изображения)
  - name: Library
    description: Каталог учебников (публичный)
  - name: Cards
    description: ИИ-карточки и интервальное повторение
  - name: Map
    description: POI и навигатор
  - name: Threads
    description: Треды форума
  - name: Comments
    description: Комментарии к тредам
  - name: Subscriptions
    description: Подписки на треды/теги/пользователей
  - name: Notifications
    description: Внутренние уведомления
  - name: Push
    description: Web Push подписки (PWA)
  - name: Admin Users
    description: Управление пользователями (admin)
  - name: Admin Reports
    description: Обработка жалоб (moderator+)
  - name: Admin Moderation
    description: Скрытие/удаление контента
  - name: Admin Library
    description: CRUD учебников (admin)
  - name: Admin POI
    description: CRUD точек интереса (admin)
  - name: Admin System
    description: Статистика и аудит-логи (admin)

security:
  - BearerAuth: []

paths:
  # ==================== AUTH ====================
  /auth/register:
    post:
      tags: [Auth]
      summary: Регистрация нового пользователя
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Пользователь создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }

  /auth/login:
    post:
      tags: [Auth]
      summary: Вход в систему
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Успешный вход
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Пользователь забанен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BanInfo'

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Обновление access-токена по refresh
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Новые токены (старый refresh инвалидирован)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '401': { $ref: '#/components/responses/Unauthorized' }

  /auth/logout:
    post:
      tags: [Auth]
      summary: Выход (инвалидация refresh-токена)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
      responses:
        '204': { description: Успешный выход }

  /auth/forgot-password:
    post:
      tags: [Auth]
      summary: Запрос ссылки для сброса пароля
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        '200':
          description: Всегда 200 (не раскрывает существование email)
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }

  /auth/reset-password:
    post:
      tags: [Auth]
      summary: Сброс пароля по токену из email
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, new_password]
              properties:
                token: { type: string }
                new_password: { type: string, minLength: 8 }
      responses:
        '200':
          description: Пароль сброшен
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }

  /auth/verify-email:
    get:
      tags: [Auth]
      summary: Подтверждение email
      security: []
      parameters:
        - name: token
          in: query
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Email подтверждён
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }

  # ==================== USERS ====================
  /users/me:
    get:
      tags: [Users]
      summary: Текущий профиль
      responses:
        '200':
          description: Профиль пользователя
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
    patch:
      tags: [Users]
      summary: Обновление профиля
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: Обновлённый профиль
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '409': { $ref: '#/components/responses/Conflict' }
    delete:
      tags: [Users]
      summary: Удаление аккаунта (soft delete)
      parameters:
        - name: password
          in: query
          required: true
          schema: { type: string }
          description: Пароль для подтверждения удаления
      responses:
        '204': { description: Аккаунт удалён }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /users/{id}:
    get:
      tags: [Users]
      summary: Публичный профиль пользователя
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Публичный профиль
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicUser'
        '404': { $ref: '#/components/responses/NotFound' }

  # ==================== UPLOAD ====================
  /upload:
    post:
      tags: [Upload]
      summary: Загрузка файла
      parameters:
        - name: type
          in: query
          required: true
          schema:
            type: string
            enum: [pdf, image, avatar]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file: { type: string, format: binary }
      responses:
        '201':
          description: Файл загружен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadResponse'
        '400': { $ref: '#/components/responses/BadRequest' }

  # ==================== LIBRARY ====================
  /library/textbooks:
    get:
      tags: [Library]
      summary: Каталог учебников
      security: []
      parameters:
        - name: q
          in: query
          schema: { type: string }
        - name: subject
          in: query
          schema: { type: string }
        - name: course
          in: query
          schema: { type: integer }
        - name: department
          in: query
          schema: { type: string }
        - name: storage_type
          in: query
          schema: { $ref: '#/components/schemas/TextbookStorageType' }
        - name: sort
          in: query
          schema:
            type: string
            enum: [title_asc, title_desc, created_at_desc]
            default: created_at_desc
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, default: 20, maximum: 100 }
      responses:
        '200':
          description: Список учебников
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginationWrapper'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/TextbookListItem'

  /library/textbooks/{id}:
    get:
      tags: [Library]
      summary: Детали учебника
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Учебник
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Textbook'
        '404': { $ref: '#/components/responses/NotFound' }

  /library/textbooks/{id}/download:
    get:
      tags: [Library]
      summary: Скачать PDF (только категория A)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '302':
          description: Редирект на presigned URL S3
          headers:
            Location:
              schema: { type: string, format: uri }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /library/textbooks/{id}/source:
    get:
      tags: [Library]
      summary: Перейти к источнику (только категория B)
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '302':
          description: Редирект на внешний URL
          headers:
            Location:
              schema: { type: string, format: uri }
        '404': { $ref: '#/components/responses/NotFound' }

  # ==================== CARDS ====================
  /cards/tasks:
    post:
      tags: [Cards]
      summary: Создать задачу на генерацию карточек
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCardTaskRequest'
      responses:
        '201':
          description: Задача создана
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardTask'
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/RateLimited' }
    get:
      tags: [Cards]
      summary: Список задач текущего пользователя
      parameters:
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/CardTaskStatus' }
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, default: 20 }
      responses:
        '200':
          description: Список задач
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginationWrapper'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/CardTask'

  /cards/tasks/{id}:
    get:
      tags: [Cards]
      summary: Детали задачи
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Задача
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardTask'
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /cards/tasks/{id}/cards:
    get:
      tags: [Cards]
      summary: Карточки, сгенерированные задачей
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, default: 50 }
      responses:
        '200':
          description: Список карточек
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginationWrapper'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Card'
        '403': { $ref: '#/components/responses/Forbidden' }

  /cards/review:
    get:
      tags: [Cards]
      summary: Получить батч карточек для повторения (SM-2)
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 20, maximum: 50 }
      responses:
        '200':
          description: Батч карточек
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ReviewCard'
                  count: { type: integer }

  /cards/{id}/rate:
    post:
      tags: [Cards]
      summary: Оценить карточку (SM-2)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [grade]
              properties:
                grade:
                  type: integer
                  minimum: 0
                  maximum: 3
                  description: 0=не помню, 1=сложно, 2=норм, 3=легко
      responses:
        '200':
          description: Обновлённый прогресс
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardProgressInfo'

  /cards/{id}/report:
    post:
      tags: [Cards]
      summary: Пожаловаться на карточку
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, maxLength: 2000 }
      responses:
        '201':
          description: Жалоба создана
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Report'

  /cards/stats:
    get:
      tags: [Cards]
      summary: Статистика обучения
      responses:
        '200':
          description: Статистика
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CardsStats'

  # ==================== MAP ====================
  /map/poi:
    get:
      tags: [Map]
      summary: Список POI
      security: []
      parameters:
        - name: campus_id
          in: query
          schema: { type: string, format: uuid }
        - name: type
          in: query
          schema: { $ref: '#/components/schemas/PoiType' }
        - name: lat
          in: query
          schema: { type: number, format: double }
        - name: lon
          in: query
          schema: { type: number, format: double }
        - name: radius
          in: query
          description: Радиус в метрах
          schema: { type: integer, minimum: 0, maximum: 50000 }
        - name: tags
          in: query
          description: Теги через запятую
          schema: { type: string }
      responses:
        '200':
          description: Список POI
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/POI'

  # ==================== THREADS ====================
  /threads:
    get:
      tags: [Threads]
      summary: Лента тредов
      parameters:
        - name: tag
          in: query
          schema: { $ref: '#/components/schemas/ThreadTag' }
        - name: author_id
          in: query
          schema: { type: string, format: uuid }
        - name: sort
          in: query
          schema:
            type: string
            enum: [created_at_desc, popular]
            default: created_at_desc
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, default: 20 }
      responses:
        '200':
          description: Список тредов
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginationWrapper'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/ThreadListItem'
    post:
      tags: [Threads]
      summary: Создать тред
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateThreadRequest'
      responses:
        '201':
          description: Тред создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Thread'

  /threads/{id}:
    get:
      tags: [Threads]
      summary: Детали треда
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Тред (views_count +1)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Thread'
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Threads]
      summary: Обновить тред (только автор)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateThreadRequest'
      responses:
        '200':
          description: Обновлённый тред
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Thread'
        '403': { $ref: '#/components/responses/Forbidden' }
    delete:
      tags: [Threads]
      summary: Удалить тред (soft, только автор)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: Удалён }
        '403': { $ref: '#/components/responses/Forbidden' }

  /threads/{id}/reactions:
    post:
      tags: [Threads]
      summary: Поставить реакцию
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [emoji]
              properties:
                emoji: { type: string, maxLength: 10 }
      responses:
        '201':
          description: Реакция добавлена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reaction'
    delete:
      tags: [Threads]
      summary: Убрать реакцию
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: emoji
          in: query
          required: true
          schema: { type: string }
      responses:
        '204': { description: Реакция убрана }

  /threads/{id}/report:
    post:
      tags: [Threads]
      summary: Пожаловаться на тред
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, maxLength: 2000 }
      responses:
        '201':
          description: Жалоба создана
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Report'

  /threads/{id}/comments:
    get:
      tags: [Threads]
      summary: Комментарии треда (дерево до 2 уровней)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, default: 50 }
      responses:
        '200':
          description: Дерево комментариев
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PaginationWrapper'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/CommentTree'

  # ==================== COMMENTS ====================
  /threads/{thread_id}/comments:
    post:
      tags: [Comments]
      summary: Создать комментарий
      parameters:
        - name: thread_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCommentRequest'
      responses:
        '201':
          description: Комментарий создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
        '400': { $ref: '#/components/responses/BadRequest' }

  /comments/{id}:
    patch:
      tags: [Comments]
      summary: Редактировать комментарий (только автор)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content: { type: string, minLength: 1, maxLength: 5000 }
      responses:
        '200':
          description: Обновлённый комментарий
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
        '403': { $ref: '#/components/responses/Forbidden' }
    delete:
      tags: [Comments]
      summary: Удалить комментарий (soft, только автор)
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: Удалён }
        '403': { $ref: '#/components/responses/Forbidden' }

  /comments/{id}/reactions:
    post:
      tags: [Comments]
      summary: Поставить реакцию на комментарий
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [emoji]
              properties:
                emoji: { type: string, maxLength: 10 }
      responses:
        '201':
          description: Реакция добавлена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Reaction'
    delete:
      tags: [Comments]
      summary: Убрать реакцию с комментария
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: emoji
          in: query
          required: true
          schema: { type: string }
      responses:
