services:
  postgres:
    image: pgvector/pgvector:pg15
    container_name: medflow_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-medflow}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - medflow-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: medflow_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - medflow-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: medflow_minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - medflow-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Разово создаёт бакет для PDF/обложек, чтобы первый же аплоад не падал
  # с "bucket does not exist" на чистом окружении.
  minio-init:
    image: minio/mc:latest
    container_name: medflow_minio_init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["sh", "-c"]
    command: >
      "mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin} &&
       mc mb -p local/${S3_BUCKET_NAME:-medflow-assets}"
    networks:
      - medflow-network

  mailhog:
    image: mailhog/mailhog:latest
    container_name: medflow_mailhog
    restart: unless-stopped
    ports:
      - "${MAILHOG_SMTP_PORT:-1025}:1025"
      - "${MAILHOG_UI_PORT:-8025}:8025"
    networks:
      - medflow-network

  # Применяет SQL-миграции перед стартом backend/worker. Разовый контейнер:
  # отрабатывает и выходит, `migrate up` идемпотентен при повторных `docker compose up`.
  migrate:
    image: migrate/migrate:v4.18.1
    container_name: medflow_migrate
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../backend/migrations:/migrations:ro
    entrypoint: ["migrate"]
    command:
      - "-path=/migrations"
      - "-database=postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-medflow}?sslmode=disable"
      - "up"
    networks:
      - medflow-network

  # Разово создаёт тестовых пользователей (admin/moderator/user@medflow.dev,
  # пароль password123) для входа в дебаге. Сам бинарь проверяет APP_ENV и
  # ничего не делает при APP_ENV=production — сервис безопасно оставлять
  # в compose, в проде он просто выйдет без изменений.
  seed:
    build:
      context: ../backend
      dockerfile: Dockerfile
      args:
        CMD_PATH: cmd/seed
    container_name: medflow_seed
    env_file: ../.env
    environment:
      APP_ENV: ${APP_ENV:-local}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - medflow-network

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
      args:
        CMD_PATH: cmd/api
    container_name: medflow_backend
    restart: unless-stopped
    env_file: ../.env
    environment:
      # Внутри compose-сети сервисы адресуются по имени и слушают свой
      # внутренний порт — а не localhost и не порт, проброшенный на хост
      # в .env (POSTGRES_PORT/REDIS_PORT там — для доступа с хост-машины).
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      S3_ENDPOINT: minio:9000
      # presigned-ссылки (скачивание PDF, ответ /upload) уходят клиенту в
      # браузер - тот не резолвит внутреннее docker-имя "minio", поэтому
      # подписываются под порт MinIO, проброшенный на хост (см. MINIO_API_PORT
      # в .env). До появления публичного домена/прода это localhost.
      S3_PUBLIC_ENDPOINT: localhost:${MINIO_API_PORT:-9000}
      SMTP_HOST: mailhog
      MAILHOG_SMTP_PORT: "1025"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8080}:8080"
    networks:
      - medflow-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: ../backend
      dockerfile: Dockerfile
      args:
        CMD_PATH: cmd/worker
    container_name: medflow_worker
    restart: unless-stopped
    env_file: ../.env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      S3_ENDPOINT: minio:9000
      SMTP_HOST: mailhog
      MAILHOG_SMTP_PORT: "1025"
      # Локальная разработка: OLLAMA_HOST задаётся в .env и по умолчанию
      # смотрит на host.docker.internal — Ollama на macOS работает нативно
      # на хосте (Docker Desktop не пробрасывает Metal GPU в контейнеры).
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - medflow-network

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api/v1
        VITE_USE_MOCKS: "false"
        # Публичный VAPID-ключ не секрет - тот же, что VAPID_PUBLIC_KEY у
        # backend/worker (см. .env), встраивается в бандл на этапе сборки.
        VITE_VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
        # Ключ Yandex Maps JS API (см. YANDEX_MAPS_API_KEY в .env) — без него
        # /navigator покажет заглушку вместо карты.
        VITE_YANDEX_MAPS_API_KEY: ${YANDEX_MAPS_API_KEY:-}
    container_name: medflow_frontend
    restart: unless-stopped
    networks:
      - medflow-network

  caddy:
    image: caddy:2-alpine
    container_name: medflow_caddy
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - backend
      - frontend
    networks:
      - medflow-network

  # --- профиль "ai": `docker compose --profile ai up` ---
  # На Linux-сервере с NVIDIA GPU — прод-вариант локальной LLM. На macOS для
  # разработки быстрее и производительнее ставить Ollama нативно на хост
  # (Docker Desktop не пробрасывает Metal GPU) и указать в .env:
  # OLLAMA_HOST=http://host.docker.internal:11434 — тогда этот сервис не нужен.
  ollama:
    image: ollama/ollama:latest
    container_name: medflow_ollama
    profiles: ["ai"]
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    networks:
      - medflow-network
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 5s
      retries: 5
    # deploy:
    #   resources:
    #     reservations:
    #       devices: [{ driver: nvidia, count: all, capabilities: [gpu] }]

  ollama-init:
    image: ollama/ollama:latest
    container_name: medflow_ollama_init
    profiles: ["ai"]
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: ["sh", "-c"]
    command: >
      "ollama pull ${OLLAMA_GENERATION_MODEL:-qwen2.5:7b-instruct} &&
       ollama pull ${OLLAMA_EMBEDDING_MODEL:-bge-m3}"
    environment:
      OLLAMA_HOST: http://ollama:11434
    networks:
      - medflow-network

  # --- профиль "monitoring": `docker compose --profile monitoring up -d` ---
  # Prometheus скрейпит backend:8080/metrics и pushgateway (разовые метрики
  # тест-прогонов, см. frontend/scripts/push-test-metrics.mjs). Grafana
  # поднимается с уже провижененным датасорсом и дашбордом - открыл и сразу
  # видно, без ручной настройки.
  prometheus:
    image: prom/prometheus:latest
    container_name: medflow_prometheus
    profiles: ["monitoring"]
    restart: unless-stopped
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    networks:
      - medflow-network

  pushgateway:
    image: prom/pushgateway:latest
    container_name: medflow_pushgateway
    profiles: ["monitoring"]
    restart: unless-stopped
    ports:
      - "${PUSHGATEWAY_PORT:-9091}:9091"
    networks:
      - medflow-network

  grafana:
    image: grafana/grafana:latest
    container_name: medflow_grafana
    profiles: ["monitoring"]
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:-admin}"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    depends_on:
      - prometheus
    networks:
      - medflow-network

volumes:
  postgres_data:
  redis_data:
  minio_data:
  caddy_data:
  ollama_data:
  prometheus_data:
  grafana_data:

networks:
  medflow-network:
    driver: bridge
